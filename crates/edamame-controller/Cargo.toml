[package]
name = "edamame-controller"
version.workspace = true
edition.workspace = true

[dependencies]
axum.workspace = true
bytes.workspace = true
clap.workspace = true
edamame-domain = { path = "../edamame-domain" }
edamame-telemetry = { path = "../edamame-telemetry" }
edamame-tls = { path = "../edamame-tls" }
opentelemetry.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tower-http.workspace = true

[dev-dependencies]
edamame-worker = { path = "../edamame-worker" }
# TLS のテストで自己署名証明書を作るために使う
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
# router を接続情報なしで直接呼ぶテストに使う
tower = { version = "0.5", features = ["util"] }
# 設定のテストで実バイナリを起動して出力を読むために使う
tokio = { workspace = true, features = ["io-util", "process"] }
