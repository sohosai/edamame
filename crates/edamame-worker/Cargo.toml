[package]
name = "edamame-worker"
version.workspace = true
edition.workspace = true

[dependencies]
axum.workspace = true
bytes.workspace = true
clap.workspace = true
edamame-domain = { path = "../edamame-domain" }
edamame-telemetry = { path = "../edamame-telemetry" }
edamame-tls = { path = "../edamame-tls" }
opentelemetry.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-stream.workspace = true
tower-http.workspace = true

[dev-dependencies]
# TLS のテストで自己署名証明書を作り、HTTPS で取得するために使う
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
rustls.workspace = true
# 設定のテストで実バイナリを起動して出力を読むために使う
tokio = { workspace = true, features = ["io-util", "process", "test-util"] }
tokio-rustls.workspace = true
