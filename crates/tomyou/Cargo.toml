license = "Apache-2.0"

[dependencies]
anyhow.workspace = true
clap.workspace = true
directories = "6"
eframe.workspace = true
egui.workspace = true
obws.workspace = true
open = "5"
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
shiguredo_rtmp.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "signal", "io-util"] }
