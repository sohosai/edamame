# edamame-publisher の設定例
# 3 系統の入力それぞれについて、1080p はそのままコピーし、720p と 480p はエンコーダで作り直す。
#
# 入力は SRT と RTMP のどちらも使える。SRT は URL の mode で待ち受け、RTMP は publisher が待ち受ける。
# RTMP では URL の app と stream が送信側と一致していなければ接続できない。
#
# 鍵と配信 URL の登録先、登録用トークン、鍵の保存先は CLI で指定する。
#   --stream-credentials-url https://live.example.test
#   --stream-ingest-token <STREAM_INGEST_TOKEN>
#   --key-file /var/lib/edamame-publisher/key.bin
#
# controller は metric が小さい順に使う。先頭が落ちたときは次の controller へ
# 送信し、登録した live_url も fallback 候補として使われる。

# 全 channel で共通のセグメント長。
# PUT の duration_ms にもこの値を使う
segment_duration_ms = 6000

# 未送信のセットを保持する期限は、backlog_limit に segment_duration_ms を掛けた時間とする。
# channel ごとに、送信待ちになってからこの時間を過ぎたセットを捨て、ライブ配信の遅れを減らす
backlog_limit = 6

[encoder]
# Intel の GPU を使う場合は h264_qsv、NVIDIA の GPU を使う場合は h264_nvenc、
# 検証で GPU を使わない場合は libx264 にする。
# QSV ではデコードと縮小も GPU で行うため、preset は veryfast から veryslow を指定する
codec = "h264_nvenc"
preset = "p5"

[[controller]]
url = "https://edamame-a.example.test"
metric = 0

[[controller]]
url = "https://edamame-b.example.test"
metric = 1

[[input]]
channel_id = "uni"
input_url = "srt://0.0.0.0:9101?mode=listener&latency=200000"
# 先頭 controller の公開マスタープレイリスト URL の上書き。
# 未指定なら controller の URL から /channels/<channel>/master.m3u8 を導出する
# live_url = "https://live.example.test/channels/uni/master.m3u8"
# メディアプレイリストに出力する暗号鍵の URI。
# client はこの URI から鍵を取得する
key_uri = "https://live.example.test/key/uni"

# bandwidth は controller へ宣言する値で、音声と MPEG-TS の多重化を含めた見積もりを書く
[[input.rendition]]
quality = "1080p"
mode = "copy"
resolution = "1920x1080"
bandwidth = 12000000

[[input.rendition]]
quality = "720p"
resolution = "1280x720"
bandwidth = 6500000
video_bitrate = 6000000

[[input.rendition]]
quality = "480p"
resolution = "854x480"
bandwidth = 1400000
video_bitrate = 1200000

[[input]]
channel_id = "1A"
input_url = "rtmp://0.0.0.0:1935/live/1A"
key_uri = "https://live.example.test/key/1A"

[[input.rendition]]
quality = "1080p"
mode = "copy"
resolution = "1920x1080"
bandwidth = 12000000

[[input.rendition]]
quality = "720p"
resolution = "1280x720"
bandwidth = 6500000
video_bitrate = 6000000

[[input.rendition]]
quality = "480p"
resolution = "854x480"
bandwidth = 1400000
video_bitrate = 1200000

[[input]]
channel_id = "kaikan"
input_url = "rtmp://0.0.0.0:1936/live/kaikan"
key_uri = "https://live.example.test/key/kaikan"

[[input.rendition]]
quality = "1080p"
