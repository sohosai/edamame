name: tomyou

on:
  push:
    paths:
      - "crates/tomyou/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/tomyou.yml"
  pull_request:
    paths:
      - "crates/tomyou/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/tomyou.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libx11-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libssl-dev \
            libxkbcommon-x11-0 libdbus-1-dev libsecret-1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy -p tomyou --all-targets -- -D warnings

      - name: Test
        run: cargo test -p tomyou
