[workspace]
members = [
  "crates/edamame-domain",
  "crates/edamame-controller",
  "crates/edamame-worker",
  "crates/edamame-publisher",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
aes = "0.8"
axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
bytes = "1"
cbc = { version = "0.1", features = ["alloc"] }
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-acme = { version = "0.15", default-features = false, features = ["axum", "tokio", "ring", "tls12", "webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs"] }
tokio-rustls = "0.26"
tokio-stream = "0.1"
toml = "0.9"
tower-http = { version = "0.6", features = ["cors"] }
url = "2"
webpki-roots = "1"
